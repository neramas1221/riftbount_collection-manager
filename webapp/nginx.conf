# Serves the built Angular app and reverse-proxies /api to the Spring Boot container, so the
# browser only ever talks to one origin — same trick proxy.conf.json does for the dev server,
# just done at the web-server level since there's no `ng serve` in production.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11), with the upstream in a variable, forces nginx to
    # resolve "card-api" per-request instead of once at startup — without this, nginx refuses
    # to boot at all if the card-api container isn't up yet (or is mid-restart) when nginx starts.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream http://card-api:8080;
        # A variable in proxy_pass disables nginx's usual "replace the matched location prefix"
        # behavior, so the original request URI has to be appended explicitly — harmless here
        # since the frontend calls /api/... and the backend's controllers are mounted at the
        # same /api/... paths, so nothing needs rewriting, just forwarding unchanged.
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular is a client-side-routed SPA — any path that isn't a real static file falls back
    # to index.html so routes like /database survive a refresh instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
